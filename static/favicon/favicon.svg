<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <!-- Background Glow -->
    <radialGradient id="nexusGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#06B6D4" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0"/>
    </radialGradient>

    <!-- Linear Gradients for Facets -->
    <linearGradient id="bladeLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>

    <linearGradient id="bladeRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>

    <linearGradient id="coreCross" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="50%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <linearGradient id="outerHex" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>

    <!-- Filter for Neon Glow -->
    <filter id="neonBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="coreGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Light Sphere -->
  <circle cx="80" cy="80" r="72" fill="url(#nexusGlow)" />

  <!-- Outer Cyber Hexagon Frame -->
  <polygon points="80,14 136,46 136,114 80,146 24,114 24,46"
           fill="none"
           stroke="url(#outerHex)"
           stroke-width="2.5"
           stroke-linejoin="round"
           opacity="0.85" />

  <!-- Hexagon Corner Node Dots -->
  <circle cx="80" cy="14" r="3" fill="#38BDF8" filter="url(#coreGlow)" />
  <circle cx="136" cy="46" r="3" fill="#8B5CF6" filter="url(#coreGlow)" />
  <circle cx="136" cy="114" r="3" fill="#EC4899" filter="url(#coreGlow)" />
  <circle cx="80" cy="146" r="3" fill="#F43F5E" filter="url(#coreGlow)" />
  <circle cx="24" cy="114" r="3" fill="#7C3AED" filter="url(#coreGlow)" />
  <circle cx="24" cy="46" r="3" fill="#38BDF8" filter="url(#coreGlow)" />

  <!-- Inner Shard Facets (Forming Stylized 'A' + 'N' Nexus Crystal) -->
  <!-- Left Wing (The 'A' Left Pillar) -->
  <path d="M80,30 L40,118 L56,118 L73,78 L80,62 Z"
        fill="url(#bladeLeft)" />

  <!-- Right Wing (The 'A' Right Pillar & 'N' Apex) -->
  <path d="M80,30 L120,118 L104,118 L87,78 L80,62 Z"
        fill="url(#bladeRight)" />

  <!-- Center Diagonal Nexus Ribbon (Completing 'N' & Dynamic Energy) -->
  <path d="M52,66 L108,102 L100,114 L44,78 Z"
        fill="url(#coreCross)"
        filter="url(#coreGlow)"
        opacity="0.95" />

  <!-- Center Diamond Spark Core -->
  <polygon points="80,68 90,80 80,92 70,80"
           fill="#FFFFFF"
           filter="url(#coreGlow)" />

  <!-- Inner Micro Diamond -->
  <polygon points="80,73 85,80 80,87 75,80"
           fill="#38BDF8" />

  <!-- Tech Orbit Circuit Accents -->
  <path d="M46,40 L34,46 L34,70" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M114,40 L126,46 L126,70" fill="none" stroke="#8B5CF6" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M46,120 L34,114 L34,90" fill="none" stroke="#A78BFA" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M114,120 L126,114 L126,90" fill="none" stroke="#EC4899" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
</svg>
